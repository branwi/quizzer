services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env before starting}
      DATABASE_URL: sqlite:////data/quizapp.db
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-60}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - quiz_data:/data
    restart: unless-stopped
volumes:
  quiz_data:
